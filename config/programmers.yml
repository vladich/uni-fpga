---
# Registry of programmers.
#
# A programmer is a tool that loads a synthesized bitstream onto a physical
# FPGA board (over JTAG, USB-DFU, SPI, or a board-specific bootloader). It
# is orthogonal to the toolchain — the same bitstream may be loaded by
# either a vendor-bundled programmer or a third-party tool like
# `openFPGALoader`.
#
# Field schema:
#   Id:                  kebab-case identifier (referenced from chips/<family>.yml or
#                        board.ExtraProgrammers); version constraints use
#                        bracket notation: `vivado_hw[*]`, `vivado_hw[2017+]`,
#                        `iceprog[git-master]`
#   Name:                display name
#   KnownVersions:       list of versions seen in the wild
#   Version:             version installed locally (for InstallDir / binary resolution)
#   Bundled:             toolchain Id this programmer ships with, or null for
#                        third-party / community tools. When non-null, the
#                        programmer is "chip-tied via toolchain": it applies
#                        wherever the chip's Toolchains include this id.
#   Binary:              executable name expected on $PATH
#   Bridge:              physical interface this programmer speaks (jtag,
#                        ft2232h-spi, ft2232h-jtag, usb-dfu, avr-mojo, etc.)
#   RequiresBridge:      bridge that must be on the board for this programmer
#                        to apply. Skipped if null (e.g., bundled vendor
#                        programmers usually accept any vendor cable).
#   SupportedFamilies:   for non-bundled programmers — list of
#                        {Producer, Family} pairs the programmer can target.
#                        Implies chip-tied compatibility.
#   RequiresBootloader:  for bootloader-tied programmers (dfu-util) — the
#                        bootloader type required on the board.
#   InstallDir:          optional override (expanded with ~ / $VAR)
#   URL:                 project / vendor page

Programmers:

