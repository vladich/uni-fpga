# 8-digit common-cathode (or common-anode with active-low logic) 7-segment display
# wired with shared segment lines and a per-digit anode-select bus. The host must
# multiplex digits in time. Used on Digilent Nexys 4 / 4 DDR / A7 / Basys 3 etc.

Peripheral:
  id: seven_segment_8digit_shared
  description: 8-digit 7-segment display, shared segment lines, per-digit anode select
  parameters:
    digits:
      type: int
      default: 8
    active:
      type: enum
      values: [high, low]
      default: low
  signals:
    - { name: segments, type: bus, width: 7, direction: output, comment: "CA, CB, CC, CD, CE, CF, CG" }
    - { name: dp,       type: scalar, direction: output, comment: "Decimal point" }
    - { name: digits,   type: bus, width: $digits, direction: output, comment: "Anode select, one-hot" }
  provides:
    - capability: seven_segment
      params:
        digits: $digits
  driver: null
  # The peripheral pin signals (`segments`, `dp`, `digits`) don't share names
  # with the capability signals (`abcdefgh`, `digit`); the codegen wires them
  # explicitly via pin_assigns. abcdefgh bit 7 is decimal point.
  pin_assigns:
    pin.segments: capability.seven_segment.abcdefgh[6:0]
    pin.dp:       capability.seven_segment.abcdefgh[7]
    pin.digits:   capability.seven_segment.digit
