# HUB75E LED matrix panel (commonly 64x32 or 64x64 RGB LEDs). Uses 6 RGB
# data lines (top + bottom halves), 5 row-select lines, plus clock/latch/output-enable.

Peripheral:
  id: hub75e_led_matrix
  description: HUB75E RGB LED matrix panel (e.g. 64x32 or 64x64)
  parameters:
    rows:
      type: int
      default: 32
    address_width:
      type: int
      default: 5
  signals:
    - { name: r1,  type: scalar, direction: output, comment: "Top half red" }
    - { name: g1,  type: scalar, direction: output, comment: "Top half green" }
    - { name: b1,  type: scalar, direction: output, comment: "Top half blue" }
    - { name: r2,  type: scalar, direction: output, comment: "Bottom half red" }
    - { name: g2,  type: scalar, direction: output, comment: "Bottom half green" }
    - { name: b2,  type: scalar, direction: output, comment: "Bottom half blue" }
    - { name: a,   type: bus, width: $address_width, direction: output, comment: "Row address" }
    - { name: clk, type: scalar, direction: output, comment: "Pixel clock" }
    - { name: lat, type: scalar, direction: output, comment: "Latch" }
    - { name: oen, type: scalar, direction: output, comment: "Output enable, active low" }
  provides:
    - capability: screen
      params:
        width: 64
        height: $rows     # 32 or 64 typically
        color_depth: 444  # one bit per channel × time-domain PWM by the driver
  driver:
    module: hub75e_led_matrix
    file: rtl/peripherals/hub75e_led_matrix.sv
    parameters:
      clk_mhz:       context.clk_mhz
      screen_height: $rows
    port_map:
      clk:   context.clk
      rst:   context.rst
      x:     capability.screen.x
      y:     capability.screen.y
      red:   capability.screen.red    # the SV ports are red/green/blue (no _i suffix)
      green: capability.screen.green
      blue:  capability.screen.blue
      r1:    pin.r1
      g1:    pin.g1
      b1:    pin.b1
      r2:    pin.r2
      g2:    pin.g2
      b2:    pin.b2
      a:     pin.a
      lat:   pin.lat
      oen:   pin.oen
      pclk:  pin.clk
