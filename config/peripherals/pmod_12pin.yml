# Standard Digilent 12-pin Pmod header: 8 data pins + 2 GND + 2 VCC.
# This peripheral is just a passthrough — it exposes the 8 data pins as a bus
# so other peripherals can be bound to a subrange of them.

Peripheral:
  id: pmod_12pin
  description: Standard Digilent 12-pin Pmod header (8 signal pins, GND/VCC not modeled)
  signals:
    - { name: io, type: bus, width: 8, direction: inout, comment: "Pins 1..4, 7..10 (top, bottom rows)" }
  # When attached "raw" (no specific external peripheral on this header), the
  # 8 data pins flow through as part of the user-facing GPIO bank.
  provides:
    - capability: gpio
      params:
        width: 8
  driver: null
