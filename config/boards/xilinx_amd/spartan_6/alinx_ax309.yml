# alinx_ax309 pin map.
# Sources (local Alinx docs):
#   ~/Alinx/.../01_学习教程之例程篇.rar (streamed 207 constraint files; 252 signals)

Board:
  id: alinx_ax309
  pinBanks:
    sys_clk:
      pins: T8
    cpu_resetn:
      pins: L3
    onboard_buttons:
      pins: [C3, D3, E4, E3]
    onboard_leds:
      pins: [P4, N5, P5, M6]
    onboard_uart:
      pins:
        rx: C11
        tx: D12
    microsd:
      pins:
        dclk: M3
        ncs: N3
        miso: L4
        mosi: L5
