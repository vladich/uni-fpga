# alinx_ax7020 pin map.
# Sources (local Alinx docs):
#   ~/Alinx/AX7020/ (aggregated XDC files; 380 unique signals)

Board:
  id: alinx_ax7020
  pinBanks:
    sys_clk:
      pins: U18
    cpu_resetn:
      pins: N15
    onboard_buttons:
      pins: [N16, N16, T17, R17]
    onboard_leds:
      pins: [M14, M15, K16, J16]
    onboard_uart:
      pins:
        rx: J19
        tx: K19
    ethernet_mdio:
      pins:
        mdc: J17
    ethernet_rgmii:
      pins:
        rxc: K19
        rx_ctl: K20
        rd[0]: J18
        rd[1]: K18
        rd[2]: J15
        rd[3]: K15
        txc: R21
        tx_ctl: R20
        td[0]: N17
        td[1]: N18
        td[2]: N19
        td[3]: N20
