Board:
  id: alinx_ax7010
  pinBanks:
    sys_clk:
      pins: U18
      frequency_mhz: 50
    cpu_resetn:
      pins: N15
    onboard_leds:
      pins:
      - M14
      - M15
      - K16
      - J16
    onboard_buttons:
      pins:
      - N15
      - N16
      - T17
      - R17
    onboard_uart:
      pins:
        tx: K19
        rx: J19
