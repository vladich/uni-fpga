# alinx_av7k300 pin map.
# Sources (local Alinx docs):
#   ~/Alinx/AV7K300/ (aggregated XDC files; 315 unique signals)

Board:
  id: alinx_av7k300
  pinBanks:
    sys_clk_p:
      pins: AE10
    cpu_resetn:
      pins: AF21
    onboard_buttons:
      pins: [AF23]
    onboard_leds:
      pins: [AF20, AE23, AB23, AC21]
    onboard_uart:
      pins:
        rx: AA27
        tx: W28
    microsd:
      pins:
        dclk: AA25
        ncs: AB25
        mosi: AB28
        miso: AB29
