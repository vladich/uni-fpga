# terasic_de23_lite pin map.
# Source: basics-graphics-music repo
#   https://raw.githubusercontent.com/yuri-panchul/basics-graphics-music/main/boards/de23_lite/board_specific.qsf

Board:
  id: terasic_de23_lite
  pinBanks:
    onboard_buttons:
      pins: [PIN_K26, PIN_K27, PIN_BK10, PIN_W12]
    onboard_switches:
      pins: [PIN_A37, PIN_B37, PIN_B26, PIN_A42, PIN_K32, PIN_A26, PIN_B27, PIN_A29, PIN_D32, PIN_A34]
    onboard_uart:
      pins:
        tx: PIN_J1
        rx: PIN_BH10
