# lattice_crosslink_nx_evn pin map.
#
# Source: litex-boards/litex_boards/platforms/lattice_crosslink_nx_evn.py
#         (Copyright (c) 2020 David Corrigan / Alan Green, BSD-2-Clause)
# Cross-referenced against Lattice's "CrossLink-NX Evaluation Board User Guide"
# (FPGA-EB-02029) — section numbers in the upstream platform file map to that
# user-guide reference. We import section 5/6/7 (clock, UART, GPIO).
#
# Part: LIFCL-40-9BG400C (default speed grade 9, BG400 package, commercial).
# A second SKU (-8BG400CES) is also valid.

Board:
  id: lattice_crosslink_nx_evn
  fpga:
    producer: Lattice
    family: Certus-NX  # parts.yml family — really LIFCL/CrossLink-NX
    part: LIFCL-40-9BG400C
  defaults:
    iostandard: LVCMOS33

  pinBanks:
    # 12 MHz oscillator on JP2 (default fitted). 125 MHz LVDS pair (C12/B12)
    # is also available but uses a different clk_input peripheral.
    clk:              { pins: "L13" }
    onboard_reset:    { pins: "G19" }                # SW4 (gsrn)
    onboard_buttons:                                  # SW2, SW3 (active-low)
      pins: ["G14", "G15"]
    onboard_switches:                                 # 8-pin DIP (active-high per LiteX)
      pins: ["N14", "M14", "M16", "M15",
             "N15", "N16", "M17", "M18"]
    onboard_leds:                                     # 14 user LEDs (8 green B1, 4 green B2, 2 yellow)
      pins: ["E17", "F13", "G13", "F14",
             "L16", "L15", "L20", "L19",
             "R17", "R18", "U20", "T20",
             "W20", "V20"]
    onboard_uart:
      pins:
        rx: "F16"
        tx: "F18"
