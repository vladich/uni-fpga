#   https://raw.githubusercontent.com/chili-chips-ba/tango-with-pango/main/0.Doc/DevKit/ExampleRTL--25G/11_key_led/prj/key_led.fdc
#   https://raw.githubusercontent.com/chili-chips-ba/tango-with-pango/main/0.Doc/DevKit/ExampleRTL--25G/19_uart_loopback/prj/uart_loopback.fdc
#   https://raw.githubusercontent.com/chili-chips-ba/tango-with-pango/main/0.Doc/DevKit/ExampleRTL--25G/45_spi_flash_rw_test/prj/spi_flash_rw_test.fdc
#   https://raw.githubusercontent.com/chili-chips-ba/tango-with-pango/main/0.Doc/DevKit/ExampleRTL--25G/46_sd_rw/prj/top_sd_rw.fdc
