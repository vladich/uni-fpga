Board:
  id: pangomicro_pangu_25k_devkit
  pinBanks:
    clk:
      pins: V9
      frequency_mhz: 50
    onboard_leds:
      pins:
      - M14
      - L14
      - P15
      - P16
    onboard_buttons:
      pins:
      - N5
      - P6
      - R7
      - T7
    onboard_reset:
      pins: C4
    onboard_uart:
      pins:
        tx: C1
        rx: C2
    microsd:
      pins:
        clk: N10
        cs: N9
        mosi: P11
        miso: M8
    spi_flash:
      pins:
        clk: R15
        cs: V3
        mosi: T13
        miso: R13
    ethernet_mdio:
      pins:
        mdio: B9
        mdc: A9
        rst_n: B6
    touch_key:
      pins: D9
