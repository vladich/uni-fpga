# alinx_ax7035b_openxc7 retargeted to nextpnr_openxc7 (open-source flow).
# Mirrors alinx_ax7035b — only the toolchain differs.

Configuration:
  id: alinx_ax7035b_openxc7
  board: alinx_ax7035b
  toolchain: nextpnr_openxc7
  attach:
  - peripheral: clock_input
    bind:
      clk: clk
  - peripheral: reset_button
    bind:
      rst: cpu_resetn
  - peripheral: button_array
    params:
      width: 4
    bind:
      btn: onboard_buttons
  - peripheral: led_bank
    params:
      width: 4
    bind:
      led: onboard_leds
  - peripheral: seven_segment_8digit_shared
    bind:
      segments:
      - onboard_7seg.ca
      - onboard_7seg.cb
      - onboard_7seg.cc
      - onboard_7seg.cd
      - onboard_7seg.ce
      - onboard_7seg.cf
      - onboard_7seg.cg
      dp: onboard_7seg.dp
      digits: onboard_7seg.anodes
  - peripheral: uart_2wire
    bind:
      tx: onboard_uart.tx
      rx: onboard_uart.rx
