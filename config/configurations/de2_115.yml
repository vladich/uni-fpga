# Configuration for variant 'de2_115'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/de2_115/board_specific.qsf

Configuration:
  id: de2_115
  board: de2_115
  toolchain: quartus_prime

  attach:
    - peripheral: clock_input
      params:
        frequency_mhz: 50
      bind:
        clk: clk50mhz
    - peripheral: button_array
      params:
        width: 4
      bind:
        btn: onboard_buttons
    - peripheral: sw_bank
      params:
        width: 18
      bind:
        sw: onboard_switches
    - peripheral: led_bank
      params:
        width: 18
      bind:
        led: onboard_leds
    - peripheral: led_bank
      params:
        width: 9
      bind:
        led: onboard_leds_green
    - peripheral: seven_segment_8digit_shared
      bind:
        segments: ['onboard_7seg.ca', 'onboard_7seg.cb', 'onboard_7seg.cc', 'onboard_7seg.cd', 'onboard_7seg.ce', 'onboard_7seg.cf', 'onboard_7seg.cg']
        dp: onboard_7seg.dp
        digits: onboard_7seg.anodes
    - peripheral: vga_4bit
      bind:
        r: onboard_vga.r
        g: onboard_vga.g
        b: onboard_vga.b
        hs: onboard_vga.hs
        vs: onboard_vga.vs
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx

  # External peripherals inferred from the variant directory name.
    - peripheral: inmp441_i2s_mic
      bind:
        lr: "gpio[0]"
        ws: "gpio[2]"
        sck: "gpio[4]"
        sd: "gpio[5]"
