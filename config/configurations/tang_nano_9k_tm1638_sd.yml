# Configuration for variant 'tang_nano_9k_tm1638_sd'.
# Generated by tools/generate_variants.py — re-run to refresh.
# Source(s):
#   - basics-graphics-music/boards/tang_nano_9k_tm1638_sd/board_specific.cst

Configuration:
  id: tang_nano_9k_tm1638_sd
  board: tang_nano_9k
  toolchain: gowin_eda

  attach:
    - peripheral: clock_input
      bind:
        clk: clk
    - peripheral: button_array
      params:
        width: 2
      bind:
        btn: onboard_buttons
    - peripheral: led_bank
      params:
        width: 6
      bind:
        led: onboard_leds
    - peripheral: uart_2wire
      bind:
        tx: onboard_uart.tx
        rx: onboard_uart.rx

  # External peripherals inferred from the variant directory name.
    - peripheral: tm1638_led_key
      bind:
        dio: "gpio[0]"
        clk: "gpio[1]"
        stb: "gpio[2]"
    - peripheral: inmp441_i2s_mic
      bind:
        lr: onboard_microsd.cs
        ws: onboard_microsd.mosi
        sck: onboard_microsd.sclk
        sd: onboard_microsd.miso
