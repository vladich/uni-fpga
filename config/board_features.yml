---
# Registry of board features.
#
# A feature is a piece of hardware ON the board (beyond the FPGA chip
# itself) that may be relevant to a user picking a board for a project:
# Ethernet PHYs, HDMI ports, FMC/PMOD expansion, on-board DDR, bootloader
# headers, etc.
#
# Each board in config/boards/<chip_producer>/<family>.yml may declare:
#
#   Features: [ethernet_1gbe, hdmi_out, ddr3_1gb, pmod_x4, ...]
#
# Features are PASSIVE metadata for filtering / display — they don't drive
# code generation. (For features that DO drive code generation, see
# config/capabilities/*.yml — that's a separate, structured contract.)
#
# Per-entry schema:
#   Id:           kebab-case feature token (referenced from board entries)
#   Name:         human-readable display name
#   Category:     one of: io, memory, connectivity, sensor, power, expansion,
#                 display, storage, programming
#   Description:  one-line summary

Features:

#  ---------- Memory ----------
  - { Id: ddr2_128mb,     Name: "DDR2 128 MB",            Category: memory,        Description: "On-board DDR2 SDRAM, 128 MB." }
