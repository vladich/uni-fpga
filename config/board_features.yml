  - { Id: ddr4_64gb,      Name: "DDR4 64 GB",             Category: memory,        Description: "On-board DDR4 SDRAM, 64 GB (BittWare-class accelerators)." }
  - { Id: ddr3_4gb,       Name: "DDR3 4 GB",              Category: memory,        Description: "On-board DDR3 / DDR3L SDRAM, 4 GB." }
  - { Id: lpddr3_1gb,     Name: "LPDDR3 1 GB",            Category: memory,        Description: "On-board LPDDR3, 1 GB." }
  - { Id: lpddr4_1gb,     Name: "LPDDR4 1 GB",            Category: memory,        Description: "On-board LPDDR4, 1 GB." }
  - { Id: lpddr4_2gb,     Name: "LPDDR4 2 GB",            Category: memory,        Description: "On-board LPDDR4, 2 GB." }
  - { Id: lpddr4_4gb,     Name: "LPDDR4 4 GB",            Category: memory,        Description: "On-board LPDDR4, 4 GB." }
  - { Id: lpddr4_8gb,     Name: "LPDDR4 8 GB",            Category: memory,        Description: "On-board LPDDR4, 8 GB." }
  - { Id: sdram_8mb,      Name: "SDRAM 8 MB",             Category: memory,        Description: "Legacy SDR-SDRAM, 8 MB (cheap Cyclone boards)." }
  - { Id: sdram_32mb,     Name: "SDRAM 32 MB",            Category: memory,        Description: "Legacy SDR-SDRAM, 32 MB." }
