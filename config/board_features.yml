  - { Id: nand_flash,     Name: "NAND Flash",             Category: storage,       Description: "Parallel NAND flash (eMMC-class density)." }
  - { Id: microsd,        Name: "microSD socket",         Category: storage,       Description: "microSD card socket (often used for boot media on SoC FPGAs)." }
  - { Id: sd_full,        Name: "SD card (full-size)",    Category: storage,       Description: "Full-size SD card slot." }
