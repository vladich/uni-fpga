---
# List of all supported toolchains.
#
# `InstallDir` is expanded with `~` and `$VAR` at read time, so paths can
# reference $HOME without committing user-specific absolutes. Each entry
# below shows the install layout we expect; if your install lives elsewhere,
# override these in a local `settings.yml` (gitignored) or set the relevant
# tool on $PATH and leave InstallDir empty.

Toolchains:
#
#  ----------------- Proprietary toolchains ------------------
#
  - Id: vivado    # Xilinx 7/Ultrascale(+)/Versal
    Name: Vivado
    Version: "2023.2"
    InstallDir: "~/Xilinx/Vivado/2023.2/"

  - Id: ise       # older Xilinx parts
    Name: XilinxISE
    Version:
    InstallDir:

  - Id: quartus_prime   # newer Altera parts
    Name: QuartusPrime
    Version: "23.1std"
    InstallDir: "~/intelFPGA_lite/23.1std/quartus/"

  - Id: quartus2    # older Altera parts (Cyclone II/III, MAX II/V)
    Name: Quartus2
    # Quartus II 13.0sp1 is the last version that supports Cyclone II/III
    # (used by DE0/DE1/DE2/dk_dev_3c120n/marsohod_mcy316). Cyclone IV/V/MAX 10
    # still go through quartus_prime.
    Version: "13.0sp1"
    InstallDir: "~/altera/13.0sp1/quartus/"

  - Id: libero_soc  # Microchip parts (SmartFusion2, IGLOO2, PolarFire, RTG4)
    Name: LiberoSoC
    Version: "2024.1"
    InstallDir: "/usr/local/microchip/Libero_SoC_v2024.1/Libero/"

  - Id: libero_ide  # smaller / older Microchip parts
    Name: LiberoIDE
    Version: 
    InstallDir:

  - Id: efinity     # Efinix parts
    Name: Efinity
    Version: "2023.2"
    InstallDir: "~/efinity/2023.2/"

  - Id: gowin_eda   # Gowin parts (Educational license)
    Name: GowinEDA
    Version: "1.9.11.03.Educational"
    InstallDir: "~/Gowin/1.9.11.03.Educational/"

  - Id: gowin_standard  # Gowin parts requiring Standard license (GW5*)
    Name: GowinStandard
    Version: "1.9.9.02"
    InstallDir: "~/Gowin/1.9.9.02/"

  - Id: pango_ds    # Pango parts
    Name: PangoDS
    Version: 
    InstallDir:

  - Id: lattice_radiant # Lattice Radiant
    Name: LatticeRadiant
    Version:
    InstallDir:

  - Id: lattice_diamond # Lattice Diamond
    Name: LatticeDiamond
    Version:
    InstallDir:

# 
#  ------ Open-source toolchains based on yosys/nextpnr -------
#
  - Id: nextpnr_openxc7  # yosys/nextpnr: Xilinx Artix7, Spartan 7, Kintex 7, Zynq 7000
    Name: OpenXC7
    Version: 
    InstallDir:

  - Id: nextpnr_icestorm # yosys/nextpnr: Lattice ICE40
    Name: IceStorm
    Version:
    InstallDir:

  - Id: nextpnr_trellis  # yosys/nextpnr: Lattice ECP5, MachXO2 CPLD
    Name: Trellis
    Version:
    InstallDir:

  - Id: nextpnr_nexus    # yosys/nextpnr-nexus: Lattice CrossLink-NX, Certus-NX, CertusPro-NX
    Name: Nexus
    Version:
    InstallDir:

  - Id: nextpnr_oxide    # yosys/nextpnr alias: Lattice Nexus (legacy stub — kept for compat)
    Name: Oxide
    Version:
    InstallDir:

  - Id: nextpnr_mistral  # yosys/nextpnr: Altera Cyclone V
    Name: Mistral
    Version:
    InstallDir:

  - Id: nextpnr_apicula  # yosys/nextpnr: Gowin LittleBee
    Name: Apicula
    Version:
    InstallDir:

  - Id: nextpnr_gatemate  # yosys/nextpnr-himbaechel: Cologne Chip GateMate
    Name: Gatemate
    Version:
    InstallDir:
